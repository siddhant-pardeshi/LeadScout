<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="crmTitle crmDesc">
  <title id="crmTitle">LeadScout CRM export: exactly ten columns</title>
  <desc id="crmDesc">A dark table preview of the ten CRM columns with three sample rows: Asha Shah, Luca de Vries and Priya Kumar, including a blank email cell and a blank LinkedIn cell.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090B18"/>
      <stop offset="0.52" stop-color="#17112F"/>
      <stop offset="1" stop-color="#081721"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.48" stop-color="#39D6FF"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#A78BFA" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-40%" width="160%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" fill="none" stroke="#A5B4FC" stroke-opacity="0.055"/>
    </pattern>
    <clipPath id="tableClip"><rect width="1138" height="252" rx="18"/></clipPath>
  </defs>

  <rect width="1200" height="470" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="470" rx="28" fill="url(#grid)"/>
  <circle cx="105" cy="-12" r="185" fill="#7C3AED" opacity="0.13">
    <animate attributeName="opacity" values="0.08;0.18;0.08" dur="4.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1118" cy="432" r="200" fill="#0EA5E9" opacity="0.10">
    <animate attributeName="opacity" values="0.07;0.16;0.07" dur="5.6s" repeatCount="indefinite"/>
  </circle>

  <g font-family="'Segoe UI',Arial,sans-serif">
    <g transform="translate(48 44)">
      <rect width="43" height="43" rx="13" fill="#7C3AED" filter="url(#glow)"/>
      <path d="M14 17h15M14 23h10M14 29h18" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <circle cx="31" cy="29" r="6" fill="#34D399"/>
    </g>
    <text x="108" y="63" font-size="25" font-weight="800" fill="#F5F3FF">CRM-READY. EXACTLY TEN COLUMNS.</text>
    <text x="108" y="90" font-size="14.5" fill="#B6BCD7">One accepted person per row — no fabricated lead, email, or LinkedIn profile.</text>
    <rect x="916" y="46" width="236" height="34" rx="17" fill="#132C2A" stroke="#236A59"/>
    <circle cx="938" cy="63" r="5" fill="#34D399"><animate attributeName="opacity" values="1;.35;1" dur="1.7s" repeatCount="indefinite"/></circle>
    <text x="954" y="68" font-size="12.5" font-weight="700" fill="#8EF0C4">CRM EXPORT CONTRACT</text>
  </g>

  <g transform="translate(31 118)">
    <g clip-path="url(#tableClip)">
      <rect width="1138" height="252" rx="18" fill="#101426" stroke="#37406A" stroke-width="1.5"/>
      <rect x="1" y="1" width="1136" height="53" rx="17" fill="#171C35"/>

      <!-- Decorative scan sweep; every label stays readable when animation is off. -->
      <rect x="-250" y="54" width="250" height="198" fill="url(#scan)" opacity=".62">
        <animate attributeName="x" values="-250;1138" dur="5.6s" repeatCount="indefinite"/>
      </rect>

      <g stroke="#27304E" stroke-width="1">
        <path d="M108 54V252M214 54V252M336 54V252M470 54V252M612 54V252M706 54V252M800 54V252M922 54V252M1044 54V252"/>
        <path d="M0 116H1138M0 178H1138M0 240H1138"/>
      </g>

      <g font-family="'Segoe UI',Arial,sans-serif" font-size="9.4" font-weight="800" fill="#C4B5FD" letter-spacing="0.3">
        <text x="10" y="24">PROSPECT_</text>
        <text x="10" y="38">FIRST_NAME</text>
        <text x="118" y="24">PROSPECT_</text>
        <text x="118" y="38">LAST_NAME</text>
        <text x="224" y="31">DESIGNATION</text>
        <text x="346" y="31">EMAIL_ID</text>
        <text x="480" y="31">COMPANY_NAME</text>
        <text x="622" y="31">COMPANY_SIZE</text>
        <text x="716" y="31">COUNTRY</text>
        <text x="810" y="31">INDUSTRY_TYPE</text>
        <text x="932" y="31">WEBSITE_NAME</text>
        <text x="1054" y="31">LINKEDIN_URL</text>
      </g>

      <g font-family="'Segoe UI',Arial,sans-serif" font-size="11.8" fill="#E7EAF8">
        <text x="10" y="90" font-weight="700">Asha</text>
        <text x="118" y="90" font-weight="700">Shah</text>
        <text x="224" y="90">Chief Technology…</text>
        <text x="346" y="90" fill="#86E9C1">asha@acme.io</text>
        <text x="480" y="90" font-weight="700">Acme Corp</text>
        <text x="622" y="90">201–500</text>
        <text x="716" y="90">India</text>
        <text x="810" y="90">Software</text>
        <text x="932" y="90" fill="#8EC8FF">acme.com</text>
        <text x="1054" y="90" fill="#8EC8FF">/in/asha-shah</text>

        <text x="10" y="152" font-weight="700">Luca</text>
        <text x="118" y="152" font-weight="700">de Vries</text>
        <text x="224" y="152">VP Product</text>
        <text x="346" y="152" fill="#9098B5">—</text>
        <text x="480" y="152" font-weight="700">Orbit Labs</text>
        <text x="622" y="152">51–200</text>
        <text x="716" y="152">Netherlands</text>
        <text x="810" y="152">SaaS</text>
        <text x="932" y="152" fill="#8EC8FF">orbitlabs.io</text>
        <text x="1054" y="152" fill="#8EC8FF">/in/luca-devries</text>

        <text x="10" y="214" font-weight="700">Priya</text>
        <text x="118" y="214" font-weight="700">Kumar</text>
        <text x="224" y="214">Head of AI</text>
        <text x="346" y="214" fill="#86E9C1">priya@nova.ai</text>
        <text x="480" y="214" font-weight="700">Nova Systems</text>
        <text x="622" y="214">1,001–5,000</text>
        <text x="716" y="214">Singapore</text>
        <text x="810" y="214">Automation</text>
        <text x="932" y="214" fill="#8EC8FF">novasystems.ai</text>
        <text x="1054" y="214" fill="#8EC8FF">/in/priya-kumar</text>
      </g>
    </g>

    <path d="M18 54H1120" stroke="url(#edge)" stroke-opacity=".72" stroke-width="2"/>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif">
    <rect x="346" y="404" width="508" height="30" rx="15" fill="#3B2181" stroke="#A78BFA" opacity=".96">
      <animate attributeName="opacity" values=".96;.60;.96" dur="2.3s" repeatCount="indefinite"/>
    </rect>
    <text x="600" y="425" text-anchor="middle" font-size="12.5" font-weight="800" fill="#FFF" letter-spacing="0.4">COPY CRM TSV  →  PASTE INTO YOUR WORKFLOW</text>
  </g>
</svg>

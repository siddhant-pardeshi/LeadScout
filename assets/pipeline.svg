<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="LeadScout pipeline">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B0D17"/>
      <stop offset="1" stop-color="#12152A"/>
    </linearGradient>
    <filter id="pblur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <clipPath id="pframe"><rect width="1200" height="280" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#pframe)">
    <rect width="1200" height="280" fill="url(#pbg)"/>

    <!-- flowing connector (under the cards) -->
    <path d="M128 122 L1072 122" stroke="#3A4162" stroke-width="3" stroke-dasharray="7 11" fill="none">
      <animate attributeName="stroke-dashoffset" values="0;-36" dur="1.1s" repeatCount="indefinite"/>
    </path>
    <!-- travelling data packets -->
    <circle r="6" fill="#A855F7" opacity="0.95">
      <animateMotion path="M128 122 L1072 122" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="6" fill="#6366F1" opacity="0.9">
      <animateMotion path="M128 122 L1072 122" dur="4.2s" begin="1.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="6" fill="#34D399" opacity="0.9">
      <animateMotion path="M128 122 L1072 122" dur="4.2s" begin="2.8s" repeatCount="indefinite"/>
    </circle>

    <!-- cards -->
    <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
      <!-- 1 input -->
      <rect x="40" y="74" width="176" height="96" rx="16" fill="#151827" stroke="#303756" stroke-width="1.5"/>
      <rect x="40" y="74" width="176" height="96" rx="16" fill="none" stroke="#8B5CF6" stroke-width="2" opacity="0">
        <animate attributeName="opacity" values="0;0.9;0" dur="3s" begin="0s" repeatCount="indefinite"/>
      </rect>
      <circle cx="58" cy="92" r="11" fill="#4F46E5"/>
      <text x="58" y="96" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">1</text>
      <g stroke="#A5B4FC" stroke-width="3" stroke-linecap="round">
        <line x1="98" y1="96" x2="150" y2="96"/>
        <line x1="98" y1="106" x2="138" y2="106"/>
        <line x1="98" y1="116" x2="146" y2="116"/>
      </g>
      <text x="128" y="142" text-anchor="middle" font-size="17" font-weight="700" fill="#E7E9F2">Your list</text>
      <text x="128" y="160" text-anchor="middle" font-size="12.5" fill="#8A92AD">50–100 inputs</text>

      <!-- 2 bing -->
      <rect x="276" y="74" width="176" height="96" rx="16" fill="#151827" stroke="#303756" stroke-width="1.5"/>
      <rect x="276" y="74" width="176" height="96" rx="16" fill="none" stroke="#8B5CF6" stroke-width="2" opacity="0">
        <animate attributeName="opacity" values="0;0.9;0" dur="3s" begin="0.6s" repeatCount="indefinite"/>
      </rect>
      <circle cx="294" cy="92" r="11" fill="#4F46E5"/>
      <text x="294" y="96" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">2</text>
      <circle cx="352" cy="103" r="13" fill="none" stroke="#60A5FA" stroke-width="4"/>
      <line x1="362" y1="113" x2="374" y2="125" stroke="#60A5FA" stroke-width="4" stroke-linecap="round"/>
      <text x="364" y="142" text-anchor="middle" font-size="17" font-weight="700" fill="#E7E9F2">Bing search</text>
      <text x="364" y="160" text-anchor="middle" font-size="12.5" fill="#8A92AD">scoped profiles</text>

      <!-- 3 linkedin -->
      <rect x="512" y="74" width="176" height="96" rx="16" fill="#151827" stroke="#303756" stroke-width="1.5"/>
      <rect x="512" y="74" width="176" height="96" rx="16" fill="none" stroke="#8B5CF6" stroke-width="2" opacity="0">
        <animate attributeName="opacity" values="0;0.9;0" dur="3s" begin="1.2s" repeatCount="indefinite"/>
      </rect>
      <circle cx="530" cy="92" r="11" fill="#4F46E5"/>
      <text x="530" y="96" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">3</text>
      <rect x="585" y="92" width="34" height="34" rx="4" fill="none" stroke="#60A5FA" stroke-width="3"/>
      <g fill="#60A5FA">
        <rect x="591" y="99" width="6" height="6"/>
        <rect x="601" y="99" width="6" height="6"/>
        <rect x="591" y="109" width="6" height="6"/>
        <rect x="601" y="109" width="6" height="6"/>
        <rect x="596" y="117" width="6" height="9"/>
      </g>
      <text x="600" y="142" text-anchor="middle" font-size="17" font-weight="700" fill="#E7E9F2">LinkedIn pages</text>
      <text x="600" y="160" text-anchor="middle" font-size="12.5" fill="#8A92AD">about-page facts</text>

      <!-- 4 ai -->
      <rect x="748" y="74" width="176" height="96" rx="16" fill="#151827" stroke="#303756" stroke-width="1.5"/>
      <rect x="748" y="74" width="176" height="96" rx="16" fill="none" stroke="#8B5CF6" stroke-width="2" opacity="0">
        <animate attributeName="opacity" values="0;0.9;0" dur="3s" begin="1.8s" repeatCount="indefinite"/>
      </rect>
      <circle cx="766" cy="92" r="11" fill="#4F46E5"/>
      <text x="766" y="96" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">4</text>
      <rect x="828" y="96" width="26" height="26" rx="6" fill="none" stroke="#C084FC" stroke-width="3"/>
      <g stroke="#C084FC" stroke-width="3" stroke-linecap="round">
        <line x1="834" y1="90" x2="834" y2="96"/>
        <line x1="841" y1="90" x2="841" y2="96"/>
        <line x1="848" y1="90" x2="848" y2="96"/>
        <line x1="834" y1="122" x2="834" y2="128"/>
        <line x1="841" y1="122" x2="841" y2="128"/>
        <line x1="848" y1="122" x2="848" y2="128"/>
        <line x1="822" y1="103" x2="828" y2="103"/>
        <line x1="822" y1="110" x2="828" y2="110"/>
        <line x1="854" y1="103" x2="860" y2="103"/>
        <line x1="854" y1="110" x2="860" y2="110"/>
      </g>
      <text x="836" y="142" text-anchor="middle" font-size="17" font-weight="700" fill="#E7E9F2">AI enrichment</text>
      <text x="836" y="160" text-anchor="middle" font-size="12.5" fill="#8A92AD">current roles</text>

      <!-- 5 excel -->
      <rect x="984" y="74" width="176" height="96" rx="16" fill="#151827" stroke="#303756" stroke-width="1.5"/>
      <rect x="984" y="74" width="176" height="96" rx="16" fill="none" stroke="#8B5CF6" stroke-width="2" opacity="0">
        <animate attributeName="opacity" values="0;0.9;0" dur="3s" begin="2.4s" repeatCount="indefinite"/>
      </rect>
      <circle cx="1002" cy="92" r="11" fill="#4F46E5"/>
      <text x="1002" y="96" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">5</text>
      <rect x="1062" y="94" width="36" height="28" rx="4" fill="none" stroke="#34D399" stroke-width="3"/>
      <line x1="1062" y1="103" x2="1098" y2="103" stroke="#34D399" stroke-width="2.5"/>
      <line x1="1062" y1="112" x2="1098" y2="112" stroke="#34D399" stroke-width="2.5"/>
      <line x1="1080" y1="94" x2="1080" y2="122" stroke="#34D399" stroke-width="2.5"/>
      <text x="1072" y="142" text-anchor="middle" font-size="17" font-weight="700" fill="#E7E9F2">CRM TSV</text>
      <text x="1072" y="160" text-anchor="middle" font-size="12.5" fill="#8A92AD">10 columns · one click</text>
    </g>

    <!-- travelling glow behind the whole flow -->
    <circle cx="128" cy="122" r="10" fill="#A855F7" opacity="0.5" filter="url(#pblur)">
      <animateMotion path="M128 122 L1072 122" dur="4.2s" repeatCount="indefinite"/>
    </circle>

    <text x="600" y="228" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
          font-size="16" fill="#6F7794">each company is researched in complete isolation — names never bleed between companies</text>
    <text x="600" y="254" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
          font-size="14.5" fill="#525A78">human-like pacing · captcha-aware · resumes automatically</text>
  </g>
</svg>
